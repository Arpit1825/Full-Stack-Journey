<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
          background-color: rgb(231, 203, 245);
            color: #333;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .educate {
            padding: 30px 20px;
            font-family: "Special Gothic Expanded One", sans-serif;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }

        main {
            background-color: white;
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1;
        }

        h3 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #0056b3;
        }

        .data {
            font-size: 18px;
            line-height: 1.6;
        }

        li {
            margin-top: 10px;
            margin-left: 20px;
        }

        footer {
            padding: 20px;
            font-size: 16px;
            text-align: center;
            color: white;
            background-color: dimgrey;
            margin-top: auto;
        }

        footer a {
            color: aquamarine;
            text-decoration: none;
        }

        footer a:hover {
            color: darkgray;
        }

        
        body.dark-mode {
            background-color: #121212 !important;
            color: #f5f5f5 !important;
        }

        body.dark-mode main {
            background-color: #1e1e1e;
            color: #e0e0e0;
            box-shadow: 0 4px 8px rgba(255,255,255,0.1);
        }

        body.dark-mode h3 {
            color: #4dabf7;
        }

        body.dark-mode a {
            color: #4dabf7;
        }

        @media (max-width: 768px) {
            .educate {
                font-size: 24px;
                padding: 15px;
            }

            main {
                width: 95%;
                padding: 20px;
                margin: 10px auto;
            }

            h3 {
                font-size: 22px;
            }

            .data {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="educate">
        <p>Educational Qualifications</p>
    </div>
    
    <main>
        <h3>Pranveer Singh Institute of Technology</h3>
        <section class="data">
            <p><strong>B.Tech in Computer Science</strong> (AI & Machine Learning)</p>
            <br>
            <ul>
                <li><strong>Relevant Coursework:</strong> DSA, Machine Learning, AI, DBMS, OOPs, OS</li>
                <li><strong>CGPA:</strong> 8.13 / 10.0 (Updated)</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Connect with me: 
            <a href="https://www.linkedin.com/in/arpit-verma-687b3b332/" target="_blank">LinkedIn</a> | 
            <a href="https://www.instagram.com" target="_blank">Instagram</a>
        </p>
        <br>
        <p>&copy; 2026 Arpit Verma</p>
    </footer> 

    <script>
        console.log("Script loaded");

        const savedTheme = localStorage.getItem('theme');
        console.log("Memory:", savedTheme);

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body> 
</html>
