<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Spotify-Clone</title>
</head>
<body>
    <nav>
       <ul>
        <li class="logo"><img src="logo.png" alt="Spotify Logo"></li>
        <li class="spot" id="upper">Spotify</li>
        <div class="homeandabout">
        <li class="homeandsearch" >Home</li>
        <li ><input type="text" placeholder=" What do you want to play?"></li>
        <li class="homeandsearch">About</li>
        </div>
       </ul>
    </nav>
    <main>
        <section class="welcome">Welcome to Spotify Clone</section>
       <div class="container">
        <h1 >One of the best NC'S Songs</h1>
        <div class="songclasscontainer">

        </div>
       </div>
    </main>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100" class="myProgressBar">
        
        <div class="icons">
            <span>⏮️</span>
            <span id="masterPlay">▶️</span> 
            <span>⏭️</span>
        </div>
        
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif"> 
            <span id="masterSongName">Warriyo - Mortals</span>
        </div>
    </div>
    
</body>
</html>
